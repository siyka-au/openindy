name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CC: gcc-14
  CXX: g++-14
  CLANG_TOOLS_VERSION: 23.1.3   # PyPI clang-format; keep in sync with the developers' version
  QT_VERSION: 6.8.3

# Layout: CMake FetchContent prefers sibling checkouts (../openindy-core,
# ../openindy-math, ../openindy-default-plugin, ../openindy-leica-plugin), so all repositories are checked out side by side in
# $GITHUB_WORKSPACE. If a sibling repository is private, add a repository
# secret SIBLING_REPO_TOKEN (read access to it); the default token only reaches
# this repository.

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: openindy }
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-core
          path: openindy-core
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-math
          path: openindy-math
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-default-plugin
          path: openindy-default-plugin
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-leica-plugin
          path: openindy-leica-plugin
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
      - name: System packages
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build g++-14
          libarmadillo-dev libblas-dev liblapack-dev libgl1-mesa-dev libxkbcommon-dev libegl1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport qtwebsockets
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-gcc14-${{ hashFiles('openindy-core/conanfile.txt', 'openindy-core/conan/profiles/*') }}
      - name: Conan packages (Release only, the packages are Release)
        working-directory: openindy-core
        run: uvx conan install . -pr:a conan/profiles/linux-gcc -s:a compiler.version=14 --build=missing -of build/conan
      - name: Configure
        working-directory: openindy
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=../openindy-core/build/conan/conan_toolchain.cmake
      - name: Build
        working-directory: openindy
        run: cmake --build build -j$(nproc)
      # The app's CMake also builds both plugins (sibling checkouts) and core as
      # subprojects; ctest runs their tests too. Qt tests run on the offscreen platform.
      - name: Test
        working-directory: openindy/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: clang-format --dry-run -Werror
        run: |
          git ls-files | grep -E '\.(cpp|h|hpp|cc)$' | grep -vE '^(lib|third_party|3rdparty|build)/' \
            | xargs uvx clang-format==$CLANG_TOOLS_VERSION --dry-run -Werror --style=file

  # The checks below have zero findings in the app's own files and fail the job.
  # The rest of .clang-tidy is informational: the log is uploaded, the job never fails
  # on it (owning-memory is disabled for the Qt parent/child pattern, see .clang-tidy).
  # Headers of the sibling checkouts and of Qt/Conan are not linted: HeaderFilterRegex
  # only matches the controller/models/ui/test directories of the openindy checkout.
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: openindy }
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-core
          path: openindy-core
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-math
          path: openindy-math
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-default-plugin
          path: openindy-default-plugin
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: siyka-au/openindy-leica-plugin
          path: openindy-leica-plugin
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
      - name: System packages
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build g++-14
          libarmadillo-dev libblas-dev liblapack-dev libgl1-mesa-dev libxkbcommon-dev libegl1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport qtwebsockets
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-gcc14-${{ hashFiles('openindy-core/conanfile.txt', 'openindy-core/conan/profiles/*') }}
      - name: Conan packages
        working-directory: openindy-core
        run: uvx conan install . -pr:a conan/profiles/linux-gcc -s:a compiler.version=14 --build=missing -of build/conan
      - name: Configure (compile_commands.json) and generate the ui/moc/protobuf headers
        working-directory: openindy
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_TOOLCHAIN_FILE=../openindy-core/build/conan/conan_toolchain.cmake
          cmake --build build --target OpenIndyApp -j$(nproc)
      - name: Select the app's own translation units
        working-directory: openindy
        run: |
          git ls-files 'main.cpp' 'controller/*.cpp' 'models/*.cpp' 'ui/*.cpp' 'test/*.cpp' \
            | while read -r f; do grep -q "\"$PWD/$f\"" build/compile_commands.json && echo "$f"; done > tidy-files.txt
          wc -l tidy-files.txt
      # --checks on the command line overrides test/.clang-tidy, so the tests' exemption from
      # avoid-magic-numbers (expected values are literals) is repeated here by file selection.
      - name: Zero-finding checks (must be clean)
        working-directory: openindy
        run: |
          CHECKS='-*,cppcoreguidelines-pro-bounds-pointer-arithmetic,cppcoreguidelines-macro-usage,cppcoreguidelines-macro-to-enum,modernize-macro-to-enum,cppcoreguidelines-non-private-member-variables-in-classes,cppcoreguidelines-avoid-non-const-global-variables'
          xargs -a tidy-files.txt -P$(nproc) -n4 \
            uvx --from clang-tidy==$CLANG_TOOLS_VERSION clang-tidy -p build --quiet \
              --checks="$CHECKS" --warnings-as-errors="$CHECKS"
          CHECKS='-*,cppcoreguidelines-avoid-magic-numbers'
          grep -v '^test/' tidy-files.txt | xargs -P$(nproc) -n4 \
            uvx --from clang-tidy==$CLANG_TOOLS_VERSION clang-tidy -p build --quiet \
              --checks="$CHECKS" --warnings-as-errors="$CHECKS"
      - name: Full .clang-tidy (informational)
        continue-on-error: true
        working-directory: openindy
        run: |
          xargs -a tidy-files.txt -P$(nproc) -n4 \
            uvx --from clang-tidy==$CLANG_TOOLS_VERSION clang-tidy -p build --quiet \
            > clang-tidy-full.log 2>&1 || true
          echo "warnings: $(grep -c 'warning:' clang-tidy-full.log || true)"
      - uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-full
          path: openindy/clang-tidy-full.log
          if-no-files-found: ignore
